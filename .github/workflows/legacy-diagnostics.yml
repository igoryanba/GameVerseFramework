name: Legacy Diagnostics
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  legacy-core:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - name: Install legacy native prerequisites
        run: sudo apt-get update && sudo apt-get install -y libclang-dev libssl-dev pkg-config
      - name: Legacy core and FCL
        run: cargo test --manifest-path core/Cargo.toml --features fivem-compat
