name: Independent Runtime M0
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check runtime formatting
        run: cargo fmt -p gameverse-protocol -p gameverse-runtime -p gameverse-transport -p gameverse-server -p gameverse-client -p gameverse-compat-fivem -- --check
      - name: Build independent packages
        run: cargo build --locked -p gameverse-protocol -p gameverse-runtime -p gameverse-transport -p gameverse-server -p gameverse-client -p gameverse-compat-fivem
      - name: Test independent packages
        shell: pwsh
        run: |
          $output = cargo test --locked -p gameverse-protocol -p gameverse-runtime -p gameverse-transport -p gameverse-server -p gameverse-client -p gameverse-compat-fivem 2>&1 | Out-String
          $code = $LASTEXITCODE
          $output
          if ($code -ne 0) {
            $tail = ($output -split "`r?`n" | Select-Object -Last 80) -join "`n"
            $annotation = $tail.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=M0 test diagnostics::$annotation"
            exit $code
          }
      - name: Lint independent packages
        run: cargo clippy --locked -p gameverse-protocol -p gameverse-runtime -p gameverse-transport -p gameverse-server -p gameverse-client -p gameverse-compat-fivem --all-targets -- -D warnings
      - name: Check dependency boundary
        run: node scripts/check-m0-boundary.mjs
      - name: Separate process acceptance
        run: node scripts/m0-smoke.mjs --seconds 10 --output m0-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m0-${{ matrix.os }}
          path: |
            m0-report/*.json
            m0-report/*.log
