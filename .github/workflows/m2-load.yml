name: M2 32 Player Smoke
on:
  push:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/protocol/**'
      - 'crates/runtime/**'
      - 'crates/transport/**'
      - 'crates/server/**'
      - 'crates/client/**'
      - '.github/workflows/m2-load.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/protocol/**'
      - 'crates/runtime/**'
      - 'crates/transport/**'
      - 'crates/server/**'
      - 'crates/client/**'
      - '.github/workflows/m2-load.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - name: Build M2 server and bots
        run: cargo build --locked --release -p gameverse-server --bin gameverse-presence-server-m2 -p gameverse-client --bin gameverse-presence-bot-m2
      - name: Run 32 clients at 20 Hz for 60 seconds
        run: |
          set -euo pipefail
          mkdir -p m2-load-report
          server=target/release/gameverse-presence-server-m2
          bot=target/release/gameverse-presence-bot-m2
          "$server" --init-identity --cert m2-load-report/server.der --key m2-load-report/server.key
          "$server" --bind 127.0.0.1:0 --cert m2-load-report/server.der --key m2-load-report/server.key --duration 75 >m2-load-report/server.jsonl 2>m2-load-report/server.log &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 100); do
            address=$(jq -r 'select(.event == "m2_ready") | .address' m2-load-report/server.jsonl 2>/dev/null | head -n1)
            test -n "$address" && break
            sleep 0.1
          done
          test -n "${address:-}"
          "$bot" --server "$address" --cert m2-load-report/server.der --clients 32 --duration 60 --report m2-load-report/clients.json
          kill -INT "$server_pid"
          wait "$server_pid"
          trap - EXIT
          jq -e '.clients == 32 and .completed == 32 and .clean_shutdown and .errors == 0 and .published >= 30000 and .received > 0' m2-load-report/clients.json
          jq -s -e 'last | .event == "m2_shutdown" and .players == 0 and .accepted_sessions == 32 and .disconnects == 32 and .sent_datagrams > 0 and .dropped_datagrams < .sent_datagrams and .max_tick_micros > 0' m2-load-report/server.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m2-32-player-smoke
          path: m2-load-report/
