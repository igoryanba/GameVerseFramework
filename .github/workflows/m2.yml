name: Independent Runtime M2
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  protocol-and-adapter:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test Presence v2 and compatibility API
        run: cargo test --locked -p gameverse-protocol -p gameverse-runtime -p gameverse-transport -p gameverse-server -p gameverse-client -p gameverse-compat-fivem -p gameverse-rp
      - name: Check formatting
        run: |
          cargo fmt -p gameverse-protocol -p gameverse-runtime -p gameverse-transport -p gameverse-server -p gameverse-client -p gameverse-compat-fivem -p gameverse-rp -- --check
          cargo fmt --manifest-path tools/fivem-analyzer/Cargo.toml -- --check
      - name: Lint independent runtime
        shell: pwsh
        run: |
          $output = cargo clippy --locked -p gameverse-protocol -p gameverse-runtime -p gameverse-transport -p gameverse-server -p gameverse-client -p gameverse-compat-fivem -p gameverse-rp --all-targets -- -D warnings 2>&1 | Out-String
          $code = $LASTEXITCODE
          $output
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "``````text`n$output`n``````"
          if ($code -ne 0) {
            $lines = $output -split "`r?`n"
            $diagnosticLines = $lines | Where-Object { $_ -match '^(error|warning):|^\s*-->|clippy::' }
            $diagnostics = if ($diagnosticLines) { $diagnosticLines -join "`n" } else { $output.Substring([Math]::Max(0, $output.Length - 4000)) }
            $annotation = $diagnostics.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Clippy diagnostics::$annotation"
            exit $code
          }
      - name: Test static resource analyzer
        run: cargo test --manifest-path tools/fivem-analyzer/Cargo.toml
      - name: Compile adapter and run protocol tests
        shell: pwsh
        run: ./adapters/gta5/setup.ps1
      - name: Compile Windows launcher
        shell: pwsh
        run: |
          dotnet build clients/windows/GameVerse.Launcher -c Release --nologo
          & ./clients/windows/GameVerse.Launcher/bin/Release/net8.0-windows/GameVerse.Launcher.exe self-test
          dotnet build clients/windows/GameVerse.UI -c Release --nologo
          & ./clients/windows/GameVerse.UI/bin/Release/net8.0-windows/GameVerse.UI.exe --self-test
      - name: Package closed-alpha Windows client
        shell: pwsh
        run: ./clients/windows/package-alpha.ps1
      - name: Verify signed update manifest
        shell: pwsh
        run: |
          & ./clients/windows/GameVerse.Launcher/bin/Release/net8.0-windows/GameVerse.Launcher.exe __generate-update-test-key "$env:RUNNER_TEMP/update-private.pem" "$env:RUNNER_TEMP/update-public.pem"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./clients/windows/create-update-manifest.ps1 -PackageRoot artifacts/GameVerse-alpha-win-x64 -BaseUrl https://updates.gameverse.invalid/alpha/ -Version 0.1.0-alpha.ci -MinimumLauncherVersion 0.1.0-alpha.1 -SigningKeyPath "$env:RUNNER_TEMP/update-private.pem" -KeyId ci-test
          & ./clients/windows/GameVerse.Launcher/bin/Release/net8.0-windows/GameVerse.Launcher.exe verify-update artifacts/GameVerse-alpha-win-x64/update-manifest.json artifacts/GameVerse-alpha-win-x64/update-manifest.sig "$env:RUNNER_TEMP/update-public.pem"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item -LiteralPath "$env:RUNNER_TEMP/update-private.pem" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: GameVerse-alpha-win-x64
          path: |
            artifacts/GameVerse-alpha-win-x64.zip
            artifacts/GameVerse-alpha-win-x64-symbols.zip
