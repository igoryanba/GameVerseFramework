[package]
name = "gameverse-resource-runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
gameverse-compat-fivem = { path = "../compat-fivem" }
gameverse-resource-manifest = { path = "../resource-manifest" }
mlua = { version = "0.10", features = ["lua54", "vendored", "serialize", "send", "anyhow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
globset = "0.4"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "gameverse-resource-host"
path = "src/main.rs"

[[bin]]
name = "gameverse-resource-acceptance"
path = "src/acceptance.rs"
