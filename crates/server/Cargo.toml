[package]
name = "gameverse-server"
version = "0.1.0"
edition = "2021"

[dependencies]
gameverse-protocol = { path = "../protocol" }
gameverse-runtime = { path = "../runtime" }
gameverse-transport = { path = "../transport" }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
