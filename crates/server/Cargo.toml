[package]
name = "gameverse-server"
default-run = "gameverse-server"
version = "0.1.0"
edition = "2021"

[dependencies]
gameverse-protocol = { path = "../protocol" }
gameverse-runtime = { path = "../runtime" }
gameverse-transport = { path = "../transport" }
gameverse-rp = { path = "../gameverse-rp" }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
clap = { version = "4", features = ["derive", "env"] }

[dev-dependencies]
tempfile = "3"
