services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gameverse
      POSTGRES_USER: gameverse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gameverse -d gameverse"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: postgres:17-alpine
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ../../crates/gameverse-rp/migrations:/migrations:ro
    command:
      - /bin/sh
      - -ec
      - |
        psql -v ON_ERROR_STOP=1 -h postgres -U gameverse -d gameverse -c \
          "CREATE TABLE IF NOT EXISTS gameverse_schema_migrations(version text PRIMARY KEY, applied_at timestamptz NOT NULL DEFAULT now())"
        for migration in /migrations/*.sql; do
          version=$$(basename "$$migration")
          applied=$$(psql -h postgres -U gameverse -d gameverse -tAc \
            "SELECT EXISTS(SELECT 1 FROM gameverse_schema_migrations WHERE version='$$version')")
          if [ "$$applied" != "t" ]; then
            psql -v ON_ERROR_STOP=1 -h postgres -U gameverse -d gameverse -f "$$migration"
            psql -v ON_ERROR_STOP=1 -h postgres -U gameverse -d gameverse -c \
              "INSERT INTO gameverse_schema_migrations(version) VALUES('$$version')"
          fi
        done
    depends_on:
      postgres:
        condition: service_healthy

  server:
    build:
      context: ../..
      dockerfile: deployment/alpha/Dockerfile
    restart: unless-stopped
    ports:
      - "30122:30122/udp"
      - "127.0.0.1:30123:30123/tcp"
    volumes:
      - server-identity:/var/lib/gameverse/identity
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:30123/v1/ready >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  server-identity:
