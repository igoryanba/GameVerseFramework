services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gameverse
      POSTGRES_USER: gameverse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gameverse -d gameverse"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build:
      context: ../..
      dockerfile: deployment/alpha/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://gameverse:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/gameverse
    ports:
      - "30122:30122/udp"
      - "127.0.0.1:30123:30123/tcp"
    volumes:
      - server-identity:/var/lib/gameverse/identity
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:30123/v1/ready >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  server-identity:
