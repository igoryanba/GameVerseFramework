[package]
name = "fivem-analyzer"
version = "0.2.0"
edition = "2021"
description = "Static FiveM resource compatibility inventory for GameVerse Framework"
authors = ["GameVerse Team"]

[dependencies]
anyhow = "1"
clap = { version = "4.4", features = ["derive"] }
regex = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
walkdir = "2.4"

[dev-dependencies]
tempfile = "3.8"

[[bin]]
name = "fivem-analyzer"
path = "src/main.rs"
